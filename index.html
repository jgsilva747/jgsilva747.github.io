<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f7;
      font-family: 'Georgia', serif;
      color: #1a1a1a;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #ccc;
      margin: 0 auto 1.5rem;
    }

    p {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1rem;
      color: #666;
      line-height: 1.6;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Portfolio</div>
    <h1>Coming Soon</h1>
    <div class="divider"></div>
    <p>Something is in the works. Check back soon.</p>
  </div>
</body>
</html>
